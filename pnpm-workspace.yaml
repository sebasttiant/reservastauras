packages:
  - .

overrides:
  picomatch@4.0.3: 4.0.4
  # Must stay >= the version next declares, otherwise this override pins the
  # vulnerable postcss (GHSA-r28c-9q8g-f849) inside next's own tree.
  postcss: 8.5.23
  '@hono/node-server@1.19.11': 1.19.14
  hono: 4.12.27
  vite: 8.1.1
  esbuild: 0.28.1
  fast-uri: 3.1.2
  "brace-expansion@>=5.0.0 <5.0.6": "5.0.6"
  tmp: 0.2.7

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@9.0.3
  - vite@8.1.1
